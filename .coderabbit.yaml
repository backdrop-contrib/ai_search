# CodeRabbit configuration
# https://docs.coderabbit.ai/reference/configuration
#
# This is a Backdrop CMS module (procedural PHP, Backdrop/Drupal-style APIs).
# The defaults review it as a generic project and emit endless nitpick-tier
# suggestions; this config lowers the noise floor so reviews surface real
# issues instead of an unending stream of style opinions.

language: en-US

reviews:
  # "chill" suppresses most nitpick/suggestion-tier comments and focuses on
  # substantive correctness and security findings.
  profile: chill

  # Don't gate on review comments; they're advisory, to be triaged.
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false

  # Skip generated, vendored, and non-source files entirely.
  path_filters:
    - "!**/vendor/**"
    - "!**/*.css"
    - "!**/*.js"
    - "!**/templates/**"
    - "!**/*.tpl.php"
    - "!**/LICENSE.txt"
    - "!**/config/*.json"
    - "!resources/**"

  # Per-path guidance so the reviewer judges PHP against Backdrop conventions
  # rather than modern framework/PSR expectations it would otherwise assume.
  path_instructions:
    - path: "**/*.{module,inc,install,php,test}"
      instructions: >
        This is Backdrop CMS (a Drupal 7 fork): procedural PHP using hooks,
        the Backdrop database API (db_select/db_query with placeholders),
        config_get/config_set, entity_load, watchdog, and t() for translation.
        Do not suggest namespaces, dependency injection, PSR-4 autoloading,
        Symfony/Laravel patterns, or Drupal 8+ APIs. Do not flag global state
        used as documented request-scoped accumulators. Focus on correctness,
        security (SQL injection, XSS, access checks, SSRF), and data integrity.

  auto_review:
    enabled: true
    drafts: false

  # Disable third-party linters that don't apply to a Backdrop module and only
  # generate noise. Re-enable individually if you wire up a real ruleset.
  tools:
    shellcheck:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    eslint:
      enabled: false

chat:
  auto_reply: true
